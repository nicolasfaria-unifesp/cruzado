<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cruzado</title>
    <style>
        * {
            box-sizing: border-box;
        }

        h1{
            color: #ffffff;
        }
        body {
            background-color: #660069;
            margin: 0;
            padding: 24px 16px;
            overflow-x: hidden;
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
        }

        h1 {
            margin-bottom: 24px;
        }

        #tabuleiro {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .linha {
            display: flex;
            gap: 5px;
            margin-bottom: 5px;
        }

        .letra {
            width: min(40px, 12vw);
            height: min(40px, 12vw);
            border: 2px solid #ccc;
            text-align: center;
            font-size: min(24px, 6vw);
            text-transform: uppercase;
            line-height: min(40px, 12vw);
        }

        .correta {
            background-color: #3aa394;
            color: white;
            border-color: #3aa394;
        }

        .lugar-errado {
            background-color: #d3ad69;
            color: white;
            border-color: #d3ad69;
        }

        .errada {
            background-color: #312a2c;
            color: white;
            border-color: #312a2c;
        }
    </style>
</head>
<body>
    <h1>Cruzado</h1>
    <div id="tabuleiro"></div>

    <script src="script.js"></script>
</body>
</html>
